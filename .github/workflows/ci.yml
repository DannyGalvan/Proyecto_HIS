name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hospital.client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: hospital.client

      - name: Lint
        run: npm run lint
        working-directory: hospital.client

      - name: Build frontend
        run: npm run build
        working-directory: hospital.client

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore .NET dependencies
        run: dotnet restore Hospital.sln

      - name: Build backend
        run: dotnet build Hospital.sln --no-restore --configuration Release

  test:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hospital.client/package-lock.json

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore .NET dependencies
        run: dotnet restore Hospital.sln

      - name: Run backend tests
        run: dotnet test Hospital.Server.Tests/Hospital.Server.Tests.csproj --no-restore

      - name: Install frontend dependencies
        run: npm ci
        working-directory: hospital.client

      - name: Run frontend tests with coverage
        run: npm run test:coverage
        working-directory: hospital.client
