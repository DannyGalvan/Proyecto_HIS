name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hospital.client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: hospital.client

      - name: Lint
        run: npm run lint
        working-directory: hospital.client

      - name: Build frontend
        run: npm run build
        working-directory: hospital.client

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore .NET dependencies
        run: dotnet restore Hospital.sln

      - name: Build backend
        run: dotnet build Hospital.sln --no-restore --configuration Release

  test:
    runs-on: ubuntu-latest
    needs: lint-and-build
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hospital.client/package-lock.json

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore .NET dependencies
        run: dotnet restore Hospital.sln

      - name: Run backend tests with coverage
        run: |
          dotnet test Hospital.Server.Tests/Hospital.Server.Tests.csproj \
            --no-restore \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=cobertura \
            /p:CoverletOutput=./coverage/backend.cobertura.xml \
            "/p:Include=[Hospital.Server]Hospital.Server.Services.Core.EntityService*%2c[Hospital.Server]Hospital.Server.Services.Core.EntitySupportService*%2c[Hospital.Server]Hospital.Server.Services.Core.AuthService*%2c[Hospital.Server]Hospital.Server.Services.Core.AppointmentStateMachine*%2c[Hospital.Server]Hospital.Server.Services.Core.SlotLockService*%2c[Hospital.Server]Hospital.Server.Services.Core.MockPaymentGateway*%2c[Hospital.Server]Hospital.Server.Services.Core.SecurityAuthService*%2c[Hospital.Server]Hospital.Server.Interceptors.*%2c[Hospital.Server]Hospital.Server.Utils.*" \
            /p:Threshold=90 \
            /p:ThresholdType=line

      - name: Install frontend dependencies
        run: npm ci
        working-directory: hospital.client

      - name: Run frontend tests with coverage
        run: npm run test:coverage
        working-directory: hospital.client

      - name: Coverage Summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Parse backend coverage
            let backendLine = 'N/A';
            let backendBranch = 'N/A';
            let backendMethod = 'N/A';
            const backendFile = './Hospital.Server.Tests/coverage/backend.cobertura.xml';
            if (fs.existsSync(backendFile)) {
              const xml = fs.readFileSync(backendFile, 'utf8');
              const lineMatch = xml.match(/line-rate="([^"]+)"/);
              const branchMatch = xml.match(/branch-rate="([^"]+)"/);
              if (lineMatch) backendLine = (parseFloat(lineMatch[1]) * 100).toFixed(2) + '%';
              if (branchMatch) backendBranch = (parseFloat(branchMatch[1]) * 100).toFixed(2) + '%';
              const methodsValid = xml.match(/methods-valid="(\d+)"/);
              const methodsCovered = xml.match(/methods-covered="(\d+)"/);
              if (methodsValid && methodsCovered) {
                backendMethod = ((parseInt(methodsCovered[1]) / parseInt(methodsValid[1])) * 100).toFixed(2) + '%';
              }
            }

            // Parse frontend coverage
            let frontendLine = 'N/A';
            let frontendBranch = 'N/A';
            let frontendFunctions = 'N/A';
            const lcovPath = './hospital.client/coverage/lcov.info';
            if (fs.existsSync(lcovPath)) {
              const lcov = fs.readFileSync(lcovPath, 'utf8');
              let lf = 0, lh = 0, bf = 0, bh = 0, fnf = 0, fnh = 0;
              for (const line of lcov.split('\n')) {
                if (line.startsWith('LF:')) lf += parseInt(line.substring(3), 10);
                else if (line.startsWith('LH:')) lh += parseInt(line.substring(3), 10);
                else if (line.startsWith('BRF:')) bf += parseInt(line.substring(4), 10);
                else if (line.startsWith('BRH:')) bh += parseInt(line.substring(4), 10);
                else if (line.startsWith('FNF:')) fnf += parseInt(line.substring(4), 10);
                else if (line.startsWith('FNH:')) fnh += parseInt(line.substring(4), 10);
              }
              if (lf > 0) frontendLine = ((lh / lf) * 100).toFixed(2) + '%';
              if (bf > 0) frontendBranch = ((bh / bf) * 100).toFixed(2) + '%';
              if (fnf > 0) frontendFunctions = ((fnh / fnf) * 100).toFixed(2) + '%';
            }

            const summary = `## 📊 Test Coverage Summary

            | Project | Lines | Branches | Methods |
            |---------|:-----:|:--------:|:-------:|
            | **Hospital.Server** (Backend) | ${backendLine} | ${backendBranch} | ${backendMethod} |
            | **hospital.client** (Frontend) | ${frontendLine} | ${frontendBranch} | ${frontendFunctions} |

            **Threshold:** 90% lines
            `.replace(/^ +/gm, '');

            await core.summary.addRaw(summary).write();
