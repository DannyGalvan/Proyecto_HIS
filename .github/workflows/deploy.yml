name: Deploy to Production

on:
  push:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hospital.client/package-lock.json

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore .NET dependencies
        run: dotnet restore Hospital.sln

      - name: Run backend tests with coverage
        run: |
          dotnet test Hospital.Server.Tests/Hospital.Server.Tests.csproj \
            --no-restore \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=cobertura \
            /p:CoverletOutput=./coverage/backend.cobertura.xml \
            "/p:Include=[Hospital.Server]Hospital.Server.Services.Core.EntityService*%2c[Hospital.Server]Hospital.Server.Services.Core.EntitySupportService*%2c[Hospital.Server]Hospital.Server.Services.Core.AuthService*%2c[Hospital.Server]Hospital.Server.Services.Core.AppointmentStateMachine*%2c[Hospital.Server]Hospital.Server.Services.Core.SlotLockService*%2c[Hospital.Server]Hospital.Server.Services.Core.MockPaymentGateway*%2c[Hospital.Server]Hospital.Server.Services.Core.SecurityAuthService*%2c[Hospital.Server]Hospital.Server.Interceptors.*%2c[Hospital.Server]Hospital.Server.Utils.*" \
            /p:Threshold=90 \
            /p:ThresholdType=line

      - name: Install frontend dependencies
        run: npm ci
        working-directory: hospital.client

      - name: Run frontend tests with coverage
        run: npm run test:coverage
        working-directory: hospital.client

      - name: Coverage Summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let backendLine = 'N/A';
            let backendBranch = 'N/A';
            const backendFile = './Hospital.Server.Tests/coverage/backend.cobertura.xml';
            if (fs.existsSync(backendFile)) {
              const xml = fs.readFileSync(backendFile, 'utf8');
              const lineMatch = xml.match(/line-rate="([^"]+)"/);
              const branchMatch = xml.match(/branch-rate="([^"]+)"/);
              if (lineMatch) backendLine = (parseFloat(lineMatch[1]) * 100).toFixed(2) + '%';
              if (branchMatch) backendBranch = (parseFloat(branchMatch[1]) * 100).toFixed(2) + '%';
            }

            let frontendLine = 'N/A';
            let frontendBranch = 'N/A';
            let frontendFunctions = 'N/A';
            const lcovPath = './hospital.client/coverage/lcov.info';
            if (fs.existsSync(lcovPath)) {
              const lcov = fs.readFileSync(lcovPath, 'utf8');
              let lf = 0, lh = 0, bf = 0, bh = 0, fnf = 0, fnh = 0;
              for (const line of lcov.split('\n')) {
                if (line.startsWith('LF:')) lf += parseInt(line.substring(3), 10);
                else if (line.startsWith('LH:')) lh += parseInt(line.substring(3), 10);
                else if (line.startsWith('BRF:')) bf += parseInt(line.substring(4), 10);
                else if (line.startsWith('BRH:')) bh += parseInt(line.substring(4), 10);
                else if (line.startsWith('FNF:')) fnf += parseInt(line.substring(4), 10);
                else if (line.startsWith('FNH:')) fnh += parseInt(line.substring(4), 10);
              }
              if (lf > 0) frontendLine = ((lh / lf) * 100).toFixed(2) + '%';
              if (bf > 0) frontendBranch = ((bh / bf) * 100).toFixed(2) + '%';
              if (fnf > 0) frontendFunctions = ((fnh / fnf) * 100).toFixed(2) + '%';
            }

            const summary = `## 📊 Test Coverage Summary\n\n| Project | Lines | Branches | Methods |\n|---------|:---:|:---:|:---:|\n| **Hospital.Server** | ${backendLine} | ${backendBranch} | — |\n| **hospital.client** | ${frontendLine} | ${frontendBranch} | ${frontendFunctions} |\n\n**Threshold:** 90% lines`;
            await core.summary.addRaw(summary).write();

  deploy:
    runs-on: ubuntu-latest
    needs: test
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hospital.client/package-lock.json

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build frontend
        run: |
          npm ci
          npm run build
        working-directory: hospital.client

      - name: Publish backend (linux-x64)
        run: |
          dotnet restore Hospital.sln
          dotnet publish Hospital.Server/Hospital.Server.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained false \
            --output ./deploy-output

      - name: Copy frontend to backend wwwroot
        run: |
          mkdir -p ./deploy-output/wwwroot
          cp -r hospital.client/dist/* ./deploy-output/wwwroot/

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: VPS_PASSWORD                      # <- Inyectamos la contraseña aquí
          script: |
            echo "🛑 Stopping hospital service..."
            echo "$VPS_PASSWORD" | sudo -S systemctl stop hospital.service || true
            sleep 2

            echo "📦 Backing up current deployment..."
            rm -rf /home/administrator/Sites/Hospital-backup
            cp -r /home/administrator/Sites/Hospital /home/administrator/Sites/Hospital-backup || true

            echo "🧹 Cleaning deployment directory..."
            rm -rf /home/administrator/Sites/Hospital/*
        env:
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}

      - name: Upload artifacts to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "deploy-output/*"
          target: "/home/administrator/Sites/Hospital"
          strip_components: 1

      - name: Start service and verify
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: VPS_PASSWORD                      # <- Inyectamos la contraseña aquí
          script: |
            DEPLOY_DIR="/home/administrator/Sites/Hospital"

            echo "🔑 Setting permissions..."

            if [ -d "$DEPLOY_DIR/deploy-output" ]; then
              mv $DEPLOY_DIR/deploy-output/* $DEPLOY_DIR/
              rm -rf $DEPLOY_DIR/deploy-output
            fi

            chmod +x $DEPLOY_DIR/Hospital.Server

            echo "📋 Restoring appsettings from backup..."
            cp /home/administrator/Sites/Hospital-backup/appsettings.json $DEPLOY_DIR/appsettings.json 2>/dev/null || true
            cp /home/administrator/Sites/Hospital-backup/appsettings.Production.json $DEPLOY_DIR/appsettings.Production.json 2>/dev/null || true

            echo "🚀 Starting hospital service..."
            echo "$VPS_PASSWORD" | sudo -S systemctl start hospital.service
            sleep 5

            if echo "$VPS_PASSWORD" | sudo -S systemctl is-active --quiet hospital.service; then
              echo "✅ hospital.service is running"
            else
              echo "❌ hospital.service failed to start, rolling back..."
              echo "$VPS_PASSWORD" | sudo -S journalctl -u hospital.service --no-pager -n 30
              rm -rf $DEPLOY_DIR/*
              cp -r /home/administrator/Sites/Hospital-backup/* $DEPLOY_DIR/
              echo "$VPS_PASSWORD" | sudo -S systemctl start hospital.service
              exit 1
            fi

            echo "🔄 Reloading nginx..."
            echo "$VPS_PASSWORD" | sudo -S nginx -t && echo "$VPS_PASSWORD" | sudo -S systemctl reload nginx

            echo "✅ Deployment complete!"
        env:
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }} # <- Traemos el secreto de GitHub
