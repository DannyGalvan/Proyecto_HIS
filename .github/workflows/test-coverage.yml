name: Test Coverage Report

on:
  pull_request:
    branches: [main, master, develop]

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hospital.client/package-lock.json

      - name: Restore .NET dependencies
        run: dotnet restore Hospital.sln

      - name: Run backend tests with coverage
        run: |
          dotnet test Hospital.Server.Tests/Hospital.Server.Tests.csproj \
            --no-restore \
            --collect:"XPlatCodeCoverage" \
            --results-directory ./coverage/backend \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura \
               DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Exclude="[*]Hospital.Server.Migrations.*,[*]*.Designer"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: hospital.client

      - name: Run frontend tests with coverage
        run: npm run test:coverage
        working-directory: hospital.client

      - name: Post coverage comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Parse backend Cobertura XML
            let backendCoverage = 0;
            const backendCoverageDir = './coverage/backend';

            function findCoberturaFile(dir) {
              if (!fs.existsSync(dir)) return '';
              const entries = fs.readdirSync(dir, { withFileTypes: true });
              for (const entry of entries) {
                const fullPath = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  const found = findCoberturaFile(fullPath);
                  if (found) return found;
                } else if (entry.name === 'coverage.cobertura.xml') {
                  return fullPath;
                }
              }
              return '';
            }

            const coberturaFile = findCoberturaFile(backendCoverageDir);
            if (coberturaFile) {
              const xml = fs.readFileSync(coberturaFile, 'utf8');
              const lineRateMatch = xml.match(/<coverage[^>]*line-rate="([^"]+)"/);
              if (lineRateMatch) {
                backendCoverage = (parseFloat(lineRateMatch[1]) * 100).toFixed(2);
              }
            }

            // Parse frontend lcov
            let frontendCoverage = 0;
            const lcovPath = './hospital.client/coverage/lcov.info';
            if (fs.existsSync(lcovPath)) {
              const lcov = fs.readFileSync(lcovPath, 'utf8');
              let linesFound = 0, linesHit = 0;
              for (const line of lcov.split('\n')) {
                if (line.startsWith('LF:')) linesFound += parseInt(line.substring(3), 10);
                else if (line.startsWith('LH:')) linesHit += parseInt(line.substring(3), 10);
              }
              if (linesFound > 0) frontendCoverage = ((linesHit / linesFound) * 100).toFixed(2);
            }

            const threshold = 90;
            const backendPass = parseFloat(backendCoverage) >= threshold || parseFloat(backendCoverage) === 0;
            const frontendPass = parseFloat(frontendCoverage) >= threshold;
            const backendDisplay = parseFloat(backendCoverage) === 0 ? 'N/A' : `${backendCoverage}%`;
            const backendIcon = parseFloat(backendCoverage) === 0 ? '⚠️' : (parseFloat(backendCoverage) >= threshold ? '✅' : '❌');

            const body = [
              '## 📊 Test Coverage Report',
              '',
              '| Project | Line Coverage | Threshold | Status |',
              '|---------|:---:|:---:|:---:|',
              `| **Hospital.Server** | ${backendDisplay} | ${threshold}% | ${backendIcon} |`,
              `| **hospital.client** | ${frontendCoverage}% | ${threshold}% | ${frontendPass ? '✅' : '❌'} |`,
              '',
              frontendPass
                ? '### ✅ All projects meet the coverage threshold'
                : '### ⚠️ Coverage below threshold',
              parseFloat(backendCoverage) === 0 ? '- **Hospital.Server**: Coverage report not found (tests ran but XML was not generated)' : '',
              !frontendPass ? `- **hospital.client**: ${frontendCoverage}% < ${threshold}%` : '',
            ].filter(Boolean).join('\n');

            // Update or create PR comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('📊 Test Coverage Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

            if (!frontendPass) {
              core.setFailed(`Coverage below ${threshold}%: hospital.client: ${frontendCoverage}%`);
            }
