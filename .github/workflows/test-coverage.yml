name: Test Coverage Report

on:
  pull_request:
    branches: [main, master, develop]

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hospital.client/package-lock.json

      - name: Restore .NET dependencies
        run: dotnet restore Hospital.sln

      - name: Run backend tests with coverage
        run: |
          dotnet test Hospital.Server.Tests/Hospital.Server.Tests.csproj \
            --no-restore \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=cobertura \
            /p:CoverletOutput=./coverage/backend.cobertura.xml \
            "/p:Include=[Hospital.Server]Hospital.Server.Services.Core.EntityService*%2c[Hospital.Server]Hospital.Server.Services.Core.EntitySupportService*%2c[Hospital.Server]Hospital.Server.Services.Core.AuthService*%2c[Hospital.Server]Hospital.Server.Services.Core.AppointmentStateMachine*%2c[Hospital.Server]Hospital.Server.Services.Core.SlotLockService*%2c[Hospital.Server]Hospital.Server.Services.Core.MockPaymentGateway*%2c[Hospital.Server]Hospital.Server.Services.Core.SecurityAuthService*%2c[Hospital.Server]Hospital.Server.Interceptors.*%2c[Hospital.Server]Hospital.Server.Utils.*" \
            /p:Threshold=90 \
            /p:ThresholdType=line

      - name: Install frontend dependencies
        run: npm ci
        working-directory: hospital.client

      - name: Run frontend tests with coverage
        run: npm run test:coverage
        working-directory: hospital.client

      - name: Post coverage comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Parse backend Cobertura XML
            let backendCoverage = 0;
            const backendFile = './Hospital.Server.Tests/coverage/backend.cobertura.xml';

            if (fs.existsSync(backendFile)) {
              const xml = fs.readFileSync(backendFile, 'utf8');
              const lineRateMatch = xml.match(/<coverage[^>]*line-rate="([^"]+)"/);
              if (lineRateMatch) {
                backendCoverage = (parseFloat(lineRateMatch[1]) * 100).toFixed(2);
              }
            }

            // Parse frontend lcov
            let frontendCoverage = 0;
            const lcovPath = './hospital.client/coverage/lcov.info';
            if (fs.existsSync(lcovPath)) {
              const lcov = fs.readFileSync(lcovPath, 'utf8');
              let linesFound = 0, linesHit = 0;
              for (const line of lcov.split('\n')) {
                if (line.startsWith('LF:')) linesFound += parseInt(line.substring(3), 10);
                else if (line.startsWith('LH:')) linesHit += parseInt(line.substring(3), 10);
              }
              if (linesFound > 0) frontendCoverage = ((linesHit / linesFound) * 100).toFixed(2);
            }

            const threshold = 90;
            const backendPass = parseFloat(backendCoverage) >= threshold;
            const frontendPass = parseFloat(frontendCoverage) >= threshold;
            const backendDisplay = parseFloat(backendCoverage) === 0 ? 'N/A (report not found)' : `${backendCoverage}%`;
            const backendIcon = parseFloat(backendCoverage) === 0 ? '⚠️' : (backendPass ? '✅' : '❌');
            const frontendPass = parseFloat(frontendCoverage) >= threshold;
            const backendDisplay = parseFloat(backendCoverage) === 0 ? 'N/A' : `${backendCoverage}%`;
            const backendIcon = parseFloat(backendCoverage) === 0 ? '⚠️' : (parseFloat(backendCoverage) >= threshold ? '✅' : '❌');

            const body = [
              '## 📊 Test Coverage Report',
              '',
              '| Project | Line Coverage | Threshold | Status |',
              '|---------|:---:|:---:|:---:|',
              `| **Hospital.Server** | ${backendDisplay} | ${threshold}% | ${backendIcon} |`,
              `| **hospital.client** | ${frontendCoverage}% | ${threshold}% | ${frontendPass ? '✅' : '❌'} |`,
              '',
              backendPass && frontendPass
                ? '### ✅ All projects meet the coverage threshold'
                : '### ⚠️ Coverage below threshold',
              !backendPass ? `- **Hospital.Server**: ${backendDisplay} < ${threshold}%` : '',
              !frontendPass ? `- **hospital.client**: ${frontendCoverage}% < ${threshold}%` : '',
            ].filter(Boolean).join('\n');

            // Update or create PR comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('📊 Test Coverage Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

            if (!frontendPass || !backendPass) {
              const failures = [];
              if (!backendPass) failures.push(`Hospital.Server: ${backendDisplay}`);
              if (!frontendPass) failures.push(`hospital.client: ${frontendCoverage}%`);
              core.setFailed(`Coverage below ${threshold}%: ${failures.join(', ')}`);
            }
